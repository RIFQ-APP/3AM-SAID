<g fill="#754021"><path d="M810 470h80v95h-80ZM950 470h80v95h-80ZM1090 470h80v95h-80Z"/></g>
<!-- shelves and cups -->
<path d="M760 330h690v22H760Z" fill="#2a170e"/><g fill="#f0d7a7" stroke="#5b351d" stroke-width="6"><path d="M815 280h50v50h-50ZM895 270h50v60h-50ZM975 280h50v50h-50ZM1055 270h50v60h-50ZM1135 280h50v50h-50ZM1215 270h50v60h-50Z"/></g>
