<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">القهوة البلدي</title><desc id="desc">Illustrated warm Egyptian neighborhood coffeehouse interior at golden hour</desc>
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#a65f2d"/><stop offset="1" stop-color="#4b2818"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#714326"/><stop offset="1" stop-color="#24140e"/></linearGradient>
 <linearGradient id="light" x2="0" y2="1"><stop stop-color="#ffd27a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></linearGradient>
 <pattern id="tiles" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M45 4 86 45 45 86 4 45Z" fill="none" stroke="#d69a54" stroke-opacity=".26" stroke-width="5"/><circle cx="45" cy="45" r="8" fill="#e5b36b" fill-opacity=".18"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1600" height="900" fill="#1c100a"/><path d="M0 0h1600v640H0Z" fill="url(#wall)"/><path d="M0 0h1600v640H0Z" fill="url(#tiles)" opacity=".7"/>
<path d="M0 640h1600v260H0Z" fill="url(#floor)"/><path d="M0 640h1600v260H0Z" fill="url(#tiles)" opacity=".32"/>
<ellipse cx="820" cy="230" rx="520" ry="190" fill="#ffc46b" opacity=".18" filter="url(#soft)"/>
<!-- arched windows -->
<g stroke="#28170e" stroke-width="22" fill="#e7a451">
 <path d="M115 370V185a135 135 0 0 1 270 0v185Z"/><path d="M430 370V185a135 135 0 0 1 270 0v185Z"/>
</g>
<g fill="#713c20" opacity=".95"><path d="M145 350V190a105 105 0 0 1 210 0v160Z"/><path d="M460 350V190a105 105 0 0 1 210 0v160Z"/></g>
<g stroke="#e9b96e" stroke-width="12" opacity=".75"><path d="M250 82v268M145 215h210M565 82v268M460 215h210"/></g>
<path d="M145 350 355 350 355 380 145 380ZM460 350h210v30H460Z" fill="#301b11"/>
