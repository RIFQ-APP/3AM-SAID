<g fill="#a96b35" stroke="#f0bd70" stroke-width="10"><ellipse cx="255" cy="655" rx="160" ry="42"/><ellipse cx="575" cy="635" rx="160" ry="42"/><ellipse cx="1110" cy="665" rx="175" ry="45"/></g>
